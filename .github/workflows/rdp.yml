name: 1 - PILIH OS
on:
  workflow_dispatch:
    inputs:
      pilih_os:
        description: 'Mau jalanin yang mana?'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - linux
          - macos
jobs:
  pemicu:
    runs-on: ubuntu-latest
    steps:
      - name: Pemicu Workflow Lain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.pilih_os }}" == "windows" ]; then
            gh workflow run windows.yml
          elif [ "${{ inputs.pilih_os }}" == "linux" ]; then
            gh workflow run linux.yml
          elif [ "${{ inputs.pilih_os }}" == "macos" ]; then
            gh workflow run macos.yml
          fi
          echo "Udah dipicu! Cek tab Actions, workflow yang lu pilih udah jalan sendiri."

name: MacOS
on:
  workflow_dispatch:
jobs:
  rdp:
    runs-on: macos-latest
    steps:
      - name: Setup MacOS RustDesk - PAKSA NYALA
        run: |
          brew install --cask rustdesk firefox visual-studio-code || true
          # Matikan dulu kalo ada yang nyangkut
          pkill -f RustDesk || true
          sleep 2
          # Nyalain jadi SERVICE, bukan cuma open biasa
          /Applications/RustDesk.app/Contents/MacOS/RustDesk --service &
          sleep 8
          open -a RustDesk || true
          sleep 8
          # Set password
          /Applications/RustDesk.app/Contents/MacOS/RustDesk --password 123456 || true
          echo "Cek RustDesk jalan apa gak:"
          ps aux | grep -i rustdesk | grep -v grep || echo "GAK JALAN!"
          echo "Cek port 21118:"
          lsof -i :21118 || netstat -an | grep 21118 || echo "PORT MASIH KETUTUP!"

      - name: Tailscale + ID RustDesk
        run: |
          brew install tailscale
          export PATH="/opt/homebrew/bin:$PATH"
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          sudo brew services start tailscale
          sleep 10
          sudo /opt/homebrew/bin/tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=macos-rdp --accept-routes
          echo "===== INI YANG LU COPY ====="
          /opt/homebrew/bin/tailscale ip -4
          echo "--- ID RUSTDESK ASLI ---"
          # Cari file ID nya dimana aja
          find ~/Library -name "*.toml" 2>/dev/null | head -20
          cat ~/Library/Application\ Support/RustDesk/RustDesk2.toml 2>/dev/null || cat ~/Library/Application\ Support/com.carriez.RustDesk/config/RustDesk2.toml 2>/dev/null || echo "File ID belum kebikin, pake IP aja"
          echo "PASSWORD: 123456"
          echo "=========================="

      - name: Tahan 6 Jam
        run: sleep 21600

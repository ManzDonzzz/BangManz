name: Windows

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe -OutFile tailscale-setup.exe
          Start-Process -FilePath .\tailscale-setup.exe -ArgumentList "/quiet" -Wait
          Start-Sleep -Seconds 30

      - name: Login Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} --hostname rdp-BangManz --accept-routes
          Start-Sleep -Seconds 10
          & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

      - name: Aktifin RDP dan Bikin User
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Hapus user lama kalo udah ada, biar gak error kalo run 2x
          if (Get-LocalUser -Name "BangManz" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "BangManz"
            Start-Sleep -Seconds 2
          }
          
          $pass = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force
          New-LocalUser -Name "BangManz" -Password $pass -FullName "BangManz" -Description "RDP User" -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "BangManz"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "BangManz"
          Write-Host "=== RDP SIAP ==="
          Write-Host "User: BangManz"

      - name: Tahan 6 Jam + Cek StarDesk
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host "Copy IP Tailscale di atas buat login RDP"
          Write-Host "StarDesk lagi install di belakang..."
          
          for ($i=0; $i -lt 36; $i++) {
            # Cek StarDesk udah ke-install belum
            $cek = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)", "$env:LOCALAPPDATA" -Recurse -Filter "StarDesk.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cek) {
              Write-Host "STARDESK UDAH KE-INSTALL di: $($cek.FullName)"
              try { Start-Process -FilePath $cek.FullName -ErrorAction SilentlyContinue } catch {}
            } else {
              Write-Host "Menit ke $($i*10) - StarDesk masih install / belum ketemu..."
            }
            Start-Sleep -Seconds 600
          }
